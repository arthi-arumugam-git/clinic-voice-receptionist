emergency_policy: >-
  This receptionist cannot assess symptoms or provide medical advice. For an
  emergency, stop the booking process and tell the caller to hang up and dial
  their local emergency service immediately: 999 for police, 998 for ambulance,
  or 997 for fire in the UAE. Do not claim to transfer or dispatch help.
  For non-emergency clinical questions, offer to take a message for clinic staff.

# UAE emergency numbers: 999 (Police), 998 (Ambulance), 997 (Fire), 901 (DHA Health Authority)
# Must include the international defaults for validation.
emergency_numbers: ["999", "998", "997", "901", "911", "000"]
