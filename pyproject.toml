[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-voice-receptionist"
version = "0.1.0"
description = "A configurable Pipecat voice receptionist demo for dental and medical clinics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Arthi Arumugam"}]
dependencies = [
  "pipecat-ai[deepgram,openai,cartesia,silero,webrtc,runner,websocket]==1.14.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "twilio>=9,<10",
]

[project.optional-dependencies]
daily = ["pipecat-ai[daily]==1.14.0"]
elevenlabs = ["pipecat-ai[elevenlabs]==1.14.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.setuptools]
py-modules = ["bot", "config", "notify", "server", "settings", "store", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
